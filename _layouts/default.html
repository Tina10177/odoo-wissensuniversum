<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #222;
      line-height: 1.6;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 56px 28px 90px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.8rem;
      color: #0b57d0;
    }

    h2 {
      font-size: 1.9rem;
      margin-top: 2.5rem;
      margin-bottom: 0.8rem;
      color: #222;
      border-top: 1px solid #d5d5d5;
      padding-top: 1.4rem;
    }

    h3 {
      font-size: 1.35rem;
      margin-top: 1.8rem;
      margin-bottom: 0.5rem;
      color: #222;
    }

    p, li {
      font-size: 1.08rem;
    }

    ul {
      padding-left: 1.4rem;
    }

    a {
      color: #0b57d0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back {
      margin-top: 2rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>
